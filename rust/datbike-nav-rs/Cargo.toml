[package]
name = "datbike-nav-rs"
version = "0.1.0"
edition = "2021"
authors = ["Dat Bike Team"]
description = "High-performance, memory-safe, on-device motorcycle routing engine for Dat Bike EV"

[lib]
name = "datbike_nav"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Graph & Geometry
petgraph = { version = "0.6", default-features = false, features = ["graphmap"] }
geo = "0.28"
geo-types = "0.7"

# Serialization & Zero-copy data handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Memory-mapped file support for zero RAM footprint
memmap2 = "0.9"

# OSM PBF parser for offline map compiler
osmpbf = "0.3"

[[bin]]
name = "osm_compiler"
path = "src/bin/osm_compiler.rs"

[[bin]]
name = "test_routing"
path = "src/bin/test_routing.rs"




[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
